server.port=8081
spring.application.name=ph-transparente-api
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# PostgreSQL Database Configuration (Production - Red Hat OpenShift)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Console (Disabled in production)
spring.h2.console.enabled=false

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Sin valores por defecto: el despliegue falla si no se configuran secretos/orígenes.
app.jwt.secret=${JWT_SECRET}
app.seed.enabled=false
app.saas.self-registration-enabled=false

# Probes de OpenShift. Readiness comprueba tambien la conexion a PostgreSQL.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
